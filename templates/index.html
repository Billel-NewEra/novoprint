{% extends "base.html" %}
{% block title %}Tableau de bord{% endblock %}
{% block content %}

<h2 class="mb-4">📊 Tableau de bord</h2>

<div class="row g-4">
  <!-- Clients -->
  <div class="col-md-4">
    <div class="card text-white bg-primary shadow-sm">
      <div class="card-body">
        <h5 class="card-title">👥 Clients</h5>
        <p class="display-6">{{ total_clients }}</p>
      </div>
    </div>
  </div>

  <!-- Commandes -->
  <div class="col-md-4">
    <div class="card text-white bg-success shadow-sm">
      <div class="card-body">
        <h5 class="card-title">📦 Commandes</h5>
        <p class="display-6">{{ total_orders }}</p>
      </div>
    </div>
  </div>

  <!-- Quantités -->
  <div class="col-md-4">
    <div class="card text-white bg-warning shadow-sm">
      <div class="card-body">
        <h5 class="card-title">🔢 Quantités commandées</h5>
        <p class="display-6">{{ total_qte }}</p>
      </div>
    </div>
  </div>
</div>

<!-- Boutons rapides -->
<div class="mt-5">
  <a href="{{ url_for('clients') }}" class="btn btn-outline-primary btn-lg me-3">👥 Voir les clients</a>
  <a href="{{ url_for('orders') }}" class="btn btn-outline-success btn-lg">📦 Voir les commandes</a>
</div>

{% endblock %}
