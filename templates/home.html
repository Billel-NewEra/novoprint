<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenue - Novoprint</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bleu-fonce: #0288d1;
      --bleu-milieu: #03a9f4;
      --bleu-clair: #b3e5fc;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      overflow: hidden;
    }

    /* 🌊 Fond animé fluide */
    body {
      background: linear-gradient(-45deg, var(--bleu-fonce), var(--bleu-milieu), var(--bleu-clair), var(--bleu-milieu));
      background-size: 400% 400%;
      animation: gradientFlow 15s ease infinite;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ✨ Halo lumineux */
    .glow {
      position: absolute;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
      filter: blur(80px);
      z-index: 0;
      animation: haloPulse 8s ease-in-out infinite;
    }

    @keyframes haloPulse {
      0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.8; }
      50% { transform: translateX(-50%) scale(1.3); opacity: 1; }
    }

    /* ✨ Particules flottantes */
    .particles {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: rgba(255,255,255,0.6);
      border-radius: 50%;
      animation: floatParticle linear infinite;
    }

    @keyframes floatParticle {
      0% { transform: translateY(100vh) scale(0.6); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* === Contenu principal === */
    #content {
      position: relative;
      z-index: 2;
    }

    #content h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 1s ease forwards;
      animation-delay: 0.3s;
    }

    #content img {
      width: 200px;
      margin-bottom: 20px;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 1s ease forwards;
      animation-delay: 0.8s;
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.6))
              drop-shadow(0 0 25px rgba(255, 255, 255, 0.4));
    }

    #content p {
      font-size: 1.1rem;
      margin-bottom: 25px;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 1s ease forwards;
      animation-delay: 1.2s;
    }

    #content a {
      display: inline-block;
      background: white;
      color: #0288d1;
      padding: 12px 30px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 50px;
      transition: all 0.3s;
      opacity: 0;
      transform: translateY(30px);
      animation: fadeInUp 1s ease forwards;
      animation-delay: 1.6s;
    }

    #content a:hover {
      background: #0288d1;
      color: white;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
      transform: scale(1.05);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 🌟 Footer animé */
    footer {
      position: absolute;
      bottom: 15px;
      width: 100%;
      text-align: center;
      font-size: 1rem;
      font-weight: 600;
      background: linear-gradient(90deg, #fff, #b3e5fc, #0288d1, #fff);
      background-size: 300% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientFlow 6s linear infinite, pulseGlow 2.5s ease-in-out infinite alternate;
      text-shadow: 0 0 10px rgba(255,255,255,0.6), 0 0 20px rgba(3,169,244,0.5);
      transition: transform 0.4s ease, text-shadow 0.4s ease;
      cursor: default;
      z-index: 2;
    }

    footer:hover {
      transform: scale(1.1);
      text-shadow: 0 0 20px rgba(255,255,255,0.9), 0 0 45px rgba(3,169,244,0.9);
    }

    @keyframes pulseGlow {
      0% { text-shadow: 0 0 10px rgba(255,255,255,0.7), 0 0 25px rgba(2,136,209,0.8); }
      100% { text-shadow: 0 0 20px rgba(255,255,255,1), 0 0 40px rgba(2,136,209,1); }
    }

    @media (max-width: 600px) {
      #content h1 { font-size: 2rem; }
      #content img { width: 160px; }
    }
  </style>
</head>
<body>

  <!-- 🌟 Halo + Particules -->
  <div class="glow"></div>
  <div class="particles">
    <div class="particle" style="left:10%; animation-duration:9s;"></div>
    <div class="particle" style="left:25%; animation-duration:12s; width:6px;height:6px;"></div>
    <div class="particle" style="left:40%; animation-duration:15s;"></div>
    <div class="particle" style="left:60%; animation-duration:11s;"></div>
    <div class="particle" style="left:75%; animation-duration:14s; width:5px;height:5px;"></div>
    <div class="particle" style="left:90%; animation-duration:10s;"></div>
  </div>

  <!-- ✨ Contenu -->
  <div id="content">
    <h1>Bienvenue sur la plateforme</h1>
    <img src="{{ url_for('static', filename='icons/logo.png') }}" alt="Logo Novoprint">
    <p>Connectez-vous pour suivre vos <strong>commandes</strong> et vos <strong>livraisons</strong>.</p>
    <a href="{{ url_for('login') }}">Se connecter</a>
  </div>

  <!-- Footer -->
  <footer>© 2025 Powered by MobiPrint</footer>

</body>
</html>
